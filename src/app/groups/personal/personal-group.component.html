<form [formGroup]="form" class="row">
  <mat-form-field appearance="outline" matTooltip="Your current age in years. Determines years remaining until retirement.">
    <mat-label>Age</mat-label>
    <input matInput type="number" formControlName="age" />
  </mat-form-field>

  <mat-form-field appearance="outline" matTooltip="Used for demographic assumptions. Doesn’t change math today.">
    <mat-label>Gender (optional)</mat-label>
    <mat-select formControlName="gender">
      <mat-option *ngFor="let g of genders" [value]="g">{{ g }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" matTooltip="Industry helps suggest defaults and context. It’s optional.">
    <mat-label>Industry (optional)</mat-label>
    <mat-select formControlName="industry">
      <mat-option *ngFor="let i of industries" [value]="i">{{ i }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" matTooltip="Age you plan to retire. Affects years to save and payout duration.">
    <mat-label>Retirement Age</mat-label>
    <input matInput type="number" formControlName="retirementAge" />
  </mat-form-field>
</form>
